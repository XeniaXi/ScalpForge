[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "scalpforge"
version = "0.1.0"
description = "Safety-first XAU/USD scalping research platform"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "pydantic-settings>=2.5,<3",
  "sqlalchemy[asyncio]>=2.0,<3",
  "asyncpg>=0.29,<1",
  "redis>=5,<6",
  "structlog>=24,<26",
  "prometheus-client>=0.21,<1",
  "pyarrow>=25,<26",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "pytest-asyncio>=0.24,<1", "httpx>=0.27,<1", "ruff>=0.7,<1", "mypy>=1.13,<2"]

[project.scripts]
scalpforge-import-ticks = "scalpforge_data.cli:main"
scalpforge-merge-dukascopy = "scalpforge_data.dukascopy_cli:main"
scalpforge-ingest-jforex = "scalpforge_data.jforex_batch_cli:main"
scalpforge-import-trade-history = "scalpforge_data.trade_history_cli:main"
scalpforge-build-features = "scalpforge_strategy.research_dataset_cli:main"
scalpforge-build-multi-hour-features = "scalpforge_strategy.multi_hour_dataset_cli:main"
scalpforge-build-multi-hour-outcomes = "scalpforge_strategy.multi_hour_outcomes_cli:main"
scalpforge-build-gold-strategy-states = "scalpforge_strategy.gold_strategy_states_cli:main"
scalpforge-build-gold-strategy-episodes = "scalpforge_strategy.gold_strategy_episodes_cli:main"
scalpforge-build-outcomes = "scalpforge_strategy.outcomes_cli:main"
scalpforge-run-baselines = "scalpforge_strategy.baselines_cli:main"
scalpforge-build-structure = "scalpforge_strategy.structural_cli:main"
scalpforge-build-session-ranges = "scalpforge_strategy.session_ranges_cli:main"
scalpforge-run-session-strategy-lab = "scalpforge_strategy.session_strategy_lab_cli:main"
scalpforge-build-session-episodes = "scalpforge_strategy.session_episodes_cli:main"
scalpforge-run-abstention-lab = "scalpforge_strategy.abstention_lab_cli:main"
scalpforge-run-path-management-lab = "scalpforge_strategy.path_management_lab_cli:main"
scalpforge-run-regime-gate-lab = "scalpforge_strategy.regime_gate_lab_cli:main"
scalpforge-run-shock-resiliency-lab = "scalpforge_strategy.shock_resiliency_lab_cli:main"
scalpforge-run-structural-lab = "scalpforge_strategy.structural_lab_cli:main"
scalpforge-run-sequence-lab = "scalpforge_strategy.sequence_lab_cli:main"
scalpforge-run-quote-pressure-lab = "scalpforge_strategy.quote_pressure_lab_cli:main"
scalpforge-run-trade-management-lab = "scalpforge_strategy.trade_management_lab_cli:main"
scalpforge-run-feasibility-map = "scalpforge_strategy.feasibility_cli:main"
scalpforge-backtest = "scalpforge_backtest.cli:main"
scalpforge-compare-feeds = "scalpforge_broker.cli:main"
scalpforge-audit-copy-trader = "scalpforge_broker.copy_trader_cli:main"
scalpforge-normalize-mql5-history = "scalpforge_broker.mql5_history_cli:main"
scalpforge-run-copy-episode-lab = "scalpforge_broker.copy_episode_lab_cli:main"
scalpforge-run-provider-path-lab = "scalpforge_broker.provider_path_lab_cli:main"
scalpforge-run-controlled-breakout-lab = "scalpforge_strategy.controlled_breakout_lab_cli:main"
scalpforge-run-breakout-confirmation-lab = "scalpforge_strategy.breakout_confirmation_lab_cli:main"
scalpforge-collect = "scalpforge_collector.cli:main"
scalpforge-ingest-news = "scalpforge_news.cli:main"
scalpforge-import-macro-events = "scalpforge_news.macro_calendar_cli:main"
scalpforge-quality = "scalpforge_quality.cli:main"

[tool.hatch.build.targets.wheel]
packages = [
  "apps/api/scalpforge_api",
  "apps/worker/scalpforge_worker",
  "packages/core/scalpforge_core",
  "packages/storage/scalpforge_storage",
  "packages/strategy/scalpforge_strategy",
  "packages/risk/scalpforge_risk",
  "packages/execution/scalpforge_execution",
  "packages/data/scalpforge_data",
  "packages/replay/scalpforge_replay",
  "packages/backtest/scalpforge_backtest",
  "packages/broker/scalpforge_broker",
  "packages/collector/scalpforge_collector",
  "packages/news/scalpforge_news",
  "packages/quality/scalpforge_quality",
]

[tool.pytest.ini_options]
pythonpath = ["apps/api", "apps/worker", "packages/core", "packages/storage", "packages/strategy", "packages/risk", "packages/execution", "packages/data", "packages/replay", "packages/backtest", "packages/broker", "packages/collector", "packages/news", "packages/quality"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
