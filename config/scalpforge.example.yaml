instrument: XAUUSD
bar_intervals: ["1s", "5s", "1m", "5m"]
trading_mode: paper
strategy:
  min_signal_score: 0.65
  require_regime_confidence: 0.60
  abstain_on_unknown_catalyst: false
research:
  virtual_strategy_initial_equity: 50.0
  strategy_families:
    - momentum
    - mean_reversion
    - breakout
    - volatility_expansion
    - liquidity_reversal
    - trend_continuation
    - news_reaction
    - post_news_reversal
    - microstructure
  arbitrary_daily_trade_cap: null
risk:
  max_risk_per_trade_pct: 0.25
  max_daily_loss_pct: 1.0
  max_drawdown_pct: 5.0
  max_spread_bps: 8.0
  max_price_age_ms: 1500
execution:
  mt4_bridge_enabled: false
  slippage_model: empirical
  commission_per_lot: 0.0
news:
  attribution_windows_seconds: [5, 30, 60, 300, 900]
  retain_raw_payloads: true
  gdelt_query: '(gold OR XAU OR bullion OR "Federal Reserve" OR FOMC OR inflation OR Treasury OR sanctions OR war) sourcelang:english'
  minimum_relevance_score: 0.43
  causal_labels_are_candidates_only: true
